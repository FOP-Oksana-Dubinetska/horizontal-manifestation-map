name: hmap-checks
on:
  workflow_dispatch:
  push:
    paths: ['at-work/horizontal-manifestation-map/**', '**']
  pull_request:
jobs:
  native-wasm-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate project
        run: |
          if test -f at-work/horizontal-manifestation-map/CMakeLists.txt; then
            echo 'HMAP_PROJECT=at-work/horizontal-manifestation-map' >> "$GITHUB_ENV"
          else
            echo 'HMAP_PROJECT=.' >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare toolchain
        run: |
          python -m pip install cmake==4.2.1 ninja==1.13.0
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = '5eb0bde7585670252e8ba05e9d361627bffd08b5'
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Prepare project inputs
        run: |
          cd "$HMAP_PROJECT"
          python tools/prepare-dependencies.py
          python tools/prepare-governance.py
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Verify candidate
        run: |
          cd "$HMAP_PROJECT"
          python tools/check-project.py --profile all
      - name: Verify native memory behavior
        run: |
          cd "$HMAP_PROJECT"
          cmake --preset native-sanitize
          cmake --build --preset native-sanitize --parallel 2
          ctest --preset native-sanitize --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hmap-check-reports
          path: '${{ env.HMAP_PROJECT }}/build/check-reports'
